name: regenerate

# Regenerates src/generated.ts from the live OpenAPI (https://api.lobstr.io/v2/openapi.json) every day, and opens
# a pull request when it changed: new operations, options or fields. The repository must allow GitHub Actions to
# create pull requests (Settings > Actions > General > Workflow permissions).

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: regenerate/openapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate from the live OpenAPI
        run: npm run generate
      - name: Did it change?
        id: diff
        run: |
          if git diff --quiet -- src/generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/generated.ts
          fi
      - name: Lint and test the new output
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint && npm test
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/generated.ts
          git commit -m "Regenerate from the live OpenAPI"
          git push --force origin "$BRANCH"
          open="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')"
          if [ -z "$open" ]; then
            {
              echo "\`npm run generate\` from https://api.lobstr.io/v2/openapi.json changed \`src/generated.ts\`; lint and unit tests pass on it."
              echo
              echo '```'
              git diff --stat HEAD~1 -- src/generated.ts
              echo '```'
            } > body.md
            gh pr create --head "$BRANCH" --base "$BASE" --title "Regenerate from the live OpenAPI" --body-file body.md
          else
            echo "Pull request #$open updated."
          fi
